<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback Treffen 4 · LAVUQ</title><style>:root{--navy:#041529;--gold:#d8b46a;--cream:#f7f3ea;--ink:#132033;--muted:#667085;--line:#e7e0d2}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--cream);color:var(--ink)}.wrap{width:min(calc(100% - 28px),620px);margin:28px auto}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 14px 34px rgba(4,21,41,.08)}.eyebrow{color:#8b6826;font-size:.78rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}h1{font-size:1.7rem;margin:8px 0}.muted{color:var(--muted);line-height:1.5}.status{margin-top:14px;padding:12px 14px;border-radius:13px;background:#f3f6f8;font-weight:750}.ok{background:#edf8f1;color:#20543b}.err{background:#fff1f0;color:#8b2925}.form{display:grid;gap:14px;margin-top:18px}.form label{font-weight:850;font-size:.9rem}.form select,.form textarea{width:100%;margin-top:7px;border:1px solid #d9d1c4;border-radius:13px;padding:13px;background:#fff;font:inherit}.form textarea{min-height:110px;resize:vertical}.btn{width:100%;border:0;border-radius:14px;padding:14px 16px;background:var(--gold);color:var(--navy);font-weight:900;font-size:1rem}.back{display:block;margin-top:14px;text-align:center;color:var(--navy);font-weight:800;text-decoration:none}</style></head><body><main class="wrap"><section class="card"><div class="eyebrow">Runde 2 · Treffen 4</div><h1>Feedback zu Treffen 4</h1><p class="muted">Deine Rückmeldung bleibt innerhalb des LAVUQ-Ablaufs. Erst wenn alle 4 Feedbacks eingegangen sind, wird das nächste Treffen freigeschaltet.</p><div id="app"></div><a id="back" class="back" href="mitglied.html#treffen">← Zurück zu Mein Q</a></section></main><script>(()=>{const p=new URLSearchParams(location.search),u=(p.get('demoUser')||'leon').toLowerCase(),names={leon:'Leon',anna:'Anna',sophie:'Sophie',daniel:'Daniel'},MK='lavuq_demo_meeting4_state_v2',FK='lavuq_demo_meeting4_feedback_v1',app=document.getElementById('app'),back=document.getElementById('back');back.href=`mitglied.html?demo=1&demoUser=${encodeURIComponent(u)}&demoStage=round2&v=${Date.now()}#treffen`;const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch{return{}}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),m=read(MK),f=read(FK),confirmed=!!m.proposal&&Object.values(m.votes||{}).filter(Boolean).length===4,count=()=>['leon','anna','sophie','daniel'].filter(x=>!!read(FK)[x]).length;function render(){const all=read(FK),n=count();if(!confirmed){app.innerHTML='<div class="status err">Treffen 4 ist noch nicht von allen 4 Teilnehmern bestätigt.</div>';return}if(all[u]){app.innerHTML=`<div class="status ok">Danke ${names[u]||''} ✓ Dein Feedback ist gespeichert.<br><br>${n} von 4 Feedbacks eingegangen.${n===4?'<br><strong>Treffen 5 kann jetzt freigeschaltet werden.</strong>':''}</div>`;return}app.innerHTML=`<div class="status">${n} von 4 Feedbacks eingegangen</div><div class="form"><label>Wie war das Treffen?<select id="rating"><option value="">Bitte auswählen</option><option>Sehr gut</option><option>Gut</option><option>Okay</option><option>Nicht so gut</option></select></label><label>Möchtest du mit der Gruppe weitermachen?<select id="cont"><option value="">Bitte auswählen</option><option>Ja</option><option>Unsicher</option><option>Nein</option></select></label><label>Optionaler Kommentar<textarea id="note" maxlength="800" placeholder="Was möchtest du LAVUQ noch mitteilen?"></textarea></label><button class="btn" id="save">Feedback speichern</button></div>`;document.getElementById('save').onclick=()=>{const r=document.getElementById('rating').value,c=document.getElementById('cont').value,note=document.getElementById('note').value.trim();if(!r||!c){alert('Bitte beantworte die beiden Pflichtfragen.');return}const x=read(FK);x[u]={rating:r,continue:c,note,submittedAt:new Date().toISOString()};write(FK,x);render()}}render()})();</script></body></html>
