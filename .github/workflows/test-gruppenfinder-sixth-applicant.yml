name: Test Gruppenfinder 6. Bewerber Ranking

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sixth-applicant-ranking-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run read-only sixth applicant ranking regression
        run: node worker/gruppenfinder-sixth-applicant-regression.js
