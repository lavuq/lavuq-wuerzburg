name: Test Treffen 1 Nachbereitung Dry-Run

on:
  workflow_dispatch:

jobs:
  first-meeting-followup-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Nachbereitung Treffen 1 nur pruefen
        env:
          PREVIEW_KEY: ${{ secrets.GRUPPENFINDER_PREVIEW_KEY }}
        run: |
          set -euo pipefail
          URL="https://lavuq-bewerbung.lavuq.workers.dev/gruppenfinder/first-meeting-followup"
          GROUP_ID="rec1qr2gZqRVxaCGk"
          BODY='{"groupId":"'"$GROUP_ID"'","asOf":"2026-09-10T20:00:00+02:00"}'
          RESP=$(curl -sS -w '\n%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer $PREVIEW_KEY" \
            -H "Content-Type: application/json" \
            --data "$BODY")
          JSON=$(echo "$RESP" | sed '$d')
          HTTP=$(echo "$RESP" | tail -n1)
          echo "$JSON" | jq .
          test "$HTTP" = "200"
          echo "$JSON" | jq -e '.ok == true and .state == "READY_FOR_FIRST_MEETING_FOLLOWUP" and .dryRun == true and .readOnly == true and .meetingAttempt == 1 and .meetingConfirmed == true and .meetingPassed == true and .reminder24hCompleted == true and .reminder2hCompleted == true and .eligibleRecipientCount == 4 and .exactlyFourEligibleRecipients == true and .wouldSendFollowupEmails == 4 and .wouldCreateFeedbackRequests == 4 and .wouldPrepareSecondMeeting == false and .emailsSent == 0 and .airtableChanged == false and .piiExposedInResponse == false' >/dev/null
          echo "HTTP: $HTTP"
          echo "Treffen 1 bestaetigt: JA"
          echo "Treffen 1 liegt in der Simulation in der Vergangenheit: JA"
          echo "24h-Erinnerung abgeschlossen: JA"
          echo "2h-Erinnerung abgeschlossen: JA"
          echo "Vier berechtigte Empfaenger: JA"
          echo "Wuerde Nachbereitungs-E-Mails senden: 4"
          echo "Wuerde Feedback-Anfragen vorbereiten: 4"
          echo "Treffen 2 automatisch vorbereiten: NEIN"
          echo "E-Mails tatsaechlich versendet: NEIN"
          echo "Airtable geaendert: NEIN"
          echo "Treffen-1-Nachbereitung-Dry-Run erfolgreich ✅"
