name: Test Gruppenfinder 4. Bewerber Trigger

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fourth-applicant-trigger-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run read-only fourth applicant trigger regression
        run: node worker/gruppenfinder-fourth-applicant-trigger-regression.js
