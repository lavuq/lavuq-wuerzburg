name: Reorder home sections

on:
  push:
    paths:
      - '.github/workflows/reorder-home-sections.yml'

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reorder key home sections and build premium brand meaning block
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          def find_sections(source):
              return list(re.finditer(r'<section\b[^>]*>.*?</section>', source, flags=re.S|re.I))

          html = re.sub(r'\s*<section\b[^>]*class=["\'][^"\']*brand-meaning-section[^"\']*["\'][^>]*>.*?</section>\s*', '\n', html, flags=re.S|re.I)

          sections = find_sections(html)
          hero = next((m for m in sections if 'mobile-hero-photo' in m.group(0)), None)
          if not hero:
              raise SystemExit('Hero Abschnitt nicht gefunden')

          meaning_block = '''<section class="brand-meaning-section" aria-labelledby="brand-meaning-title">
            <div class="brand-meaning-card">
              <div class="brand-meaning-eyebrow">Was LAVUQ bedeutet</div>
              <h2 class="brand-meaning-title" id="brand-meaning-title">Mehr als ein Name.</h2>
              <p class="brand-meaning-intro">LAVUQ verbindet Menschen aus Würzburg & Umgebung, die neue Freundschaften suchen – ohne Dating. Gemeinsam entstehen echte Treffen, Austausch, Vertrauen und Unternehmungen.</p>
              <div class="brand-meaning-grid" aria-label="Bedeutung von LAVUQ">
                <div class="brand-meaning-item"><span class="brand-meaning-letter">L</span><span class="brand-meaning-word">Lachen</span></div>
                <div class="brand-meaning-item"><span class="brand-meaning-letter">A</span><span class="brand-meaning-word">Austausch</span></div>
                <div class="brand-meaning-item"><span class="brand-meaning-letter">V</span><span class="brand-meaning-word">Vertrauen</span></div>
                <div class="brand-meaning-item"><span class="brand-meaning-letter">U</span><span class="brand-meaning-word">Unternehmungen</span></div>
                <div class="brand-meaning-item q-item"><span class="brand-meaning-letter">Q</span><span class="brand-meaning-word">Quelle</span></div>
              </div>
              <div class="brand-meaning-claim"><strong>Q</strong><span>LAVU-Q – die Quelle für neue Freundschaften in Würzburg & Umgebung.</span></div>
            </div>
          </section>'''

          insert_at = hero.end()
          html = html[:insert_at] + '\n' + meaning_block + html[insert_at:]

          sections = find_sections(html)
          mein = next((m for m in sections if 'Goldenes LAVUQ Q – Mein Q' in m.group(0)), None)
          so = next((m for m in sections if re.search(r'id=["\']so-gehts["\']', m.group(0), flags=re.I)), None)
          preference = next((m for m in sections if 'preference-section' in m.group(0) or 'Deine Präferenz' in m.group(0)), None)
          klare = next((m for m in sections if 'Klare Abgrenzung' in m.group(0)), None)

          if not mein or not so or not preference or not klare:
              raise SystemExit('Mein Q, So funktioniert\'s, Deine Präferenz oder Klare Abgrenzung nicht gefunden')

          mein_block = mein.group(0)
          so_block = so.group(0)
          preference_block = preference.group(0)
          klare_block = klare.group(0)

          for block in (so_block, preference_block, klare_block):
              pos = html.find(block)
              if pos >= 0:
                  html = html[:pos] + html[pos + len(block):]

          mein_pos = html.find(mein_block)
          if mein_pos < 0:
              raise SystemExit('Mein Q Abschnitt nach Entfernen nicht wiedergefunden')
          insert_at = mein_pos + len(mein_block)
          html = html[:insert_at] + '\n' + so_block + html[insert_at:]

          so_pos = html.find(so_block)
          if so_pos < 0:
              raise SystemExit('So funktioniert\'s Abschnitt nach Einfügen nicht wiedergefunden')
          insert_at = so_pos + len(so_block)
          html = html[:insert_at] + '\n' + preference_block + html[insert_at:]

          preference_pos = html.find(preference_block)
          if preference_pos < 0:
              raise SystemExit('Deine Präferenz Abschnitt nach Einfügen nicht wiedergefunden')
          insert_at = preference_pos + len(preference_block)
          html = html[:insert_at] + '\n' + klare_block + html[insert_at:]

          sections = find_sections(html)
          safety = next((m for m in sections if 'safety-feature' in m.group(0) or 'Sicherheit bei LAVUQ' in m.group(0)), None)
          glance = next((m for m in sections if 'Auf einen Blick' in m.group(0)), None)
          if not safety or not glance:
              raise SystemExit('Sicherheit oder Auf einen Blick nicht gefunden')

          safety_block = safety.group(0)
          safety_pos = html.find(safety_block)
          html = html[:safety_pos] + html[safety_pos + len(safety_block):]
          glance_pos = html.find(glance.group(0))
          if glance_pos < 0:
              raise SystemExit('Auf einen Blick nach Entfernen nicht wiedergefunden')
          new_html = html[:glance_pos] + safety_block + '\n' + html[glance_pos:]

          # Move only the mobile center Q slightly upward.
          new_html = new_html.replace('bottom:-3px!important;', 'bottom:8px!important;')

          new_html = re.sub(
              r'header-q-background-fix\.css\?v=[^"\']+',
              'header-q-background-fix.css?v=20260907-0103',
              new_html
          )

          premium_link = '<link rel="stylesheet" href="brand-meaning-premium.css?v=20260907-0103">'
          if re.search(r'<link\s+rel=["\']stylesheet["\']\s+href=["\']brand-meaning-premium\.css[^"\']*["\']\s*/?>', new_html, flags=re.I):
              new_html = re.sub(r'<link\s+rel=["\']stylesheet["\']\s+href=["\']brand-meaning-premium\.css[^"\']*["\']\s*/?>', premium_link, new_html, flags=re.I)
          else:
              new_html = new_html.replace('</head>', premium_link + '</head>', 1)

          original = path.read_text(encoding='utf-8')
          if new_html != original:
              path.write_text(new_html, encoding='utf-8')
              print('Updated premium brand meaning section, styles and mobile Q position successfully')
          else:
              print('Already in desired state')
          PY

      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Raise mobile header Q slightly"
          git push
