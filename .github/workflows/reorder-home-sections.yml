name: Reorder home sections

on:
  push:
    paths:
      - '.github/workflows/reorder-home-sections.yml'

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reorder key home sections and refresh mobile CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          def find_sections(source):
              return list(re.finditer(r'<section\b[^>]*>.*?</section>', source, flags=re.S|re.I))

          sections = find_sections(html)
          mein = next((m for m in sections if 'Goldenes LAVUQ Q – Mein Q' in m.group(0)), None)
          so = next((m for m in sections if re.search(r'id=["\']so-gehts["\']', m.group(0), flags=re.I)), None)
          klare = next((m for m in sections if 'Klare Abgrenzung' in m.group(0)), None)

          if not mein or not so or not klare:
              raise SystemExit('Mein Q, So funktioniert\'s oder Klare Abgrenzung nicht gefunden')

          mein_block = mein.group(0)
          so_block = so.group(0)
          klare_block = klare.group(0)

          for block in (so_block, klare_block):
              pos = html.find(block)
              if pos >= 0:
                  html = html[:pos] + html[pos + len(block):]

          mein_pos = html.find(mein_block)
          if mein_pos < 0:
              raise SystemExit('Mein Q Abschnitt nach Entfernen nicht wiedergefunden')
          insert_at = mein_pos + len(mein_block)
          html = html[:insert_at] + '\n' + so_block + html[insert_at:]

          so_pos = html.find(so_block)
          if so_pos < 0:
              raise SystemExit('So funktioniert\'s Abschnitt nach Einfügen nicht wiedergefunden')
          insert_at = so_pos + len(so_block)
          new_html = html[:insert_at] + '\n' + klare_block + html[insert_at:]

          # Force browsers to fetch the latest CSS containing the corrected stacked safety layout.
          new_html = re.sub(
              r'header-q-background-fix\.css\?v=[^"\']+',
              'header-q-background-fix.css?v=20260907-0042',
              new_html
          )

          original = path.read_text(encoding='utf-8')
          if new_html != original:
              path.write_text(new_html, encoding='utf-8')
              print('Updated section order and CSS cache-buster successfully')
          else:
              print('Already in desired state')
          PY

      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh mobile safety layout CSS"
          git push
