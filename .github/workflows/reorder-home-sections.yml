name: Reorder home sections

on:
  push:
    paths:
      - '.github/workflows/reorder-home-sections.yml'

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move So funktioniert's directly after Mein Q
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          sections = list(re.finditer(r'<section\b[^>]*>.*?</section>', html, flags=re.S|re.I))
          mein = next((m for m in sections if 'Goldenes LAVUQ Q – Mein Q' in m.group(0)), None)
          so = next((m for m in sections if re.search(r'id=["\']so-gehts["\']', m.group(0), flags=re.I)), None)

          if not mein or not so:
              raise SystemExit('Mein Q oder So funktioniert\'s Abschnitt nicht gefunden')

          mein_block = mein.group(0)
          so_block = so.group(0)

          # Remove So funktioniert's from its old position.
          html_without_so = html[:so.start()] + html[so.end():]

          # Find Mein Q again after removal and insert directly afterwards.
          mein_pos = html_without_so.find(mein_block)
          if mein_pos < 0:
              raise SystemExit('Mein Q Abschnitt nach Entfernen nicht wiedergefunden')
          insert_at = mein_pos + len(mein_block)
          new_html = html_without_so[:insert_at] + '\n' + so_block + html_without_so[insert_at:]

          if new_html != html:
              path.write_text(new_html, encoding='utf-8')
              print('Reordered sections successfully')
          else:
              print('Already in desired order')
          PY

      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move So funktioniert's after Mein Q"
          git push
