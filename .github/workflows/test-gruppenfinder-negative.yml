name: Test Gruppenfinder Negativfilter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run read-only negative regression
        run: node worker/gruppenfinder-negative-regression.js
