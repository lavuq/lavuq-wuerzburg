name: Test Gruppenfinder kontrollierte Kontaktfreigabe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-contact-release-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run read-only controlled contact release regression
        run: node worker/gruppenfinder-controlled-contact-release-regression.js
