name: Gruppenfinder Auto-Prüfung

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Geschützte read-only Gruppenprüfung
        id: preview
        env:
          PREVIEW_KEY: ${{ secrets.GRUPPENFINDER_PREVIEW_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${PREVIEW_KEY:-}" ]; then
            echo "Fehler: GitHub Secret GRUPPENFINDER_PREVIEW_KEY fehlt."
            exit 1
          fi

          tmp_body="$(mktemp)"
          http_code="$(curl -sS \
            -o "$tmp_body" \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${PREVIEW_KEY}" \
            --get \
            --data-urlencode "limit=10" \
            "https://lavuq-bewerbung.lavuq.workers.dev/gruppenfinder/group-proposals-preview")"

          RESPONSE_FILE="$tmp_body" HTTP_CODE="$http_code" GITHUB_OUTPUT="$GITHUB_OUTPUT" python3 - <<'PY'
          import hashlib, json, os, sys

          with open(os.environ["RESPONSE_FILE"], "r", encoding="utf-8") as fh:
              data = json.load(fh)

          http_code = os.environ["HTTP_CODE"]
          if http_code != "200" or data.get("ok") is not True:
              print(f"Gruppenfinder Auto-Prüfung fehlgeschlagen: HTTP {http_code}, Code: {data.get('code', '—')}")
              sys.exit(1)

          if data.get("mode") != "read-only":
              print(f"Sicherheitsstopp: Unerwarteter Modus {data.get('mode')}")
              sys.exit(1)

          print("LAVUQ Gruppenfinder Auto-Prüfung erfolgreich ✅")
          print("Modus: read-only")
          print(f"Freigegebene, ungebundene Bewerber: {data.get('eligibleApplicants', 0)}")
          print(f"Berechnete Paar-Scores: {data.get('pairScoresComputed', 0)}")
          print(f"Sichere Paar-Kanten >=65: {data.get('allowedPairs', 0)}")
          print(f"Geeignete Gruppen: {data.get('suitableGroups', 0)}")

          proposals = data.get("proposals") or []
          proposal_found = bool(proposals)
          fingerprint = "none"
          if proposal_found:
              ids = sorted(str(x) for x in (proposals[0].get("applicantIds") or []))
              fingerprint = hashlib.sha256("|".join(ids).encode("utf-8")).hexdigest()[:20]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"proposal_found={'true' if proposal_found else 'false'}\n")
              out.write(f"proposal_fingerprint={fingerprint}\n")

          if proposal_found:
              best = proposals[0]
              print("GRUPPENVORSCHLAG GEFUNDEN ✅")
              print(f"Gruppen-Durchschnitt: {best.get('groupAverage', '—')}")
              print(f"Schwächster Paar-Score: {best.get('weakestPair', '—')}")
              print(f"Empfehlung: {best.get('recommendation', '—')}")
              print(f"Ausgegebene Vorschläge: {len(proposals)}")
              print(f"Vorschlags-Fingerabdruck: {fingerprint}")
          else:
              print(f"Noch kein Gruppenvorschlag. Status: {data.get('state', '—')}")

          print("Airtable geändert: NEIN")
          print("Gruppe automatisch angelegt: NEIN")
          print("Einladungen versendet: NEIN")
          print("Kontaktdaten freigegeben: NEIN")
          PY

          rm -f "$tmp_body"

      - name: Prüfen ob dieser Vorschlag bereits gemeldet wurde
        id: notification-cache
        if: steps.preview.outputs.proposal_found == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .gruppenfinder-notified
          key: gruppenfinder-notified-${{ steps.preview.outputs.proposal_fingerprint }}
          lookup-only: true

      - name: Interne Benachrichtigung bei neuem Gruppenvorschlag
        if: steps.preview.outputs.proposal_found == 'true' && steps.notification-cache.outputs.cache-hit != 'true'
        env:
          PREVIEW_KEY: ${{ secrets.GRUPPENFINDER_PREVIEW_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          tmp_body="$(mktemp)"
          http_code="$(curl -sS \
            -o "$tmp_body" \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${PREVIEW_KEY}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "https://lavuq-bewerbung.lavuq.workers.dev/gruppenfinder/proposal-notification")"

          RESPONSE_FILE="$tmp_body" HTTP_CODE="$http_code" python3 - <<'PY'
          import json, os, sys

          with open(os.environ["RESPONSE_FILE"], "r", encoding="utf-8") as fh:
              data = json.load(fh)

          if os.environ["HTTP_CODE"] != "200" or data.get("ok") is not True:
              print(f"Interne Benachrichtigung fehlgeschlagen: HTTP {os.environ['HTTP_CODE']}")
              sys.exit(1)

          if data.get("notificationSent") is not True:
              print("Sicherheitsstopp: Es wurde trotz Gruppenvorschlag keine Benachrichtigung bestätigt.")
              sys.exit(1)

          print("Interne LAVUQ-Benachrichtigung versendet ✅")
          print("Gruppe automatisch angelegt: NEIN")
          print("Einladungen versendet: NEIN")
          print("Kontaktdaten freigegeben: NEIN")
          PY

          rm -f "$tmp_body"
          printf '%s\n' "${{ steps.preview.outputs.proposal_fingerprint }}" > .gruppenfinder-notified

      - name: Benachrichtigungsstatus speichern
        if: steps.preview.outputs.proposal_found == 'true' && steps.notification-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .gruppenfinder-notified
          key: gruppenfinder-notified-${{ steps.preview.outputs.proposal_fingerprint }}

      - name: Bereits gemeldeten Vorschlag nicht erneut senden
        if: steps.preview.outputs.proposal_found == 'true' && steps.notification-cache.outputs.cache-hit == 'true'
        run: echo "Dieser Gruppenvorschlag wurde bereits intern gemeldet. Keine weitere E-Mail."
