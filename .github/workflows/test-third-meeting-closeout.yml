name: Test Treffen 3 Abschluss

on:
  workflow_dispatch:

jobs:
  controlled-closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Treffen-3-Abschluss kontrolliert ausfuehren
        env:
          PREVIEW_KEY: ${{ secrets.GRUPPENFINDER_PREVIEW_KEY }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${PREVIEW_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"meetingRecordId":"recoW2GmA9HQpCYxQ","controlledExecute":true,"confirmation":"TREFFEN_3_GRUPPE_ABSCHLIESSEN_UND_MAILS_SENDEN","allowBeforeMeetingForTest":true}' \
            https://lavuq-bewerbung.lavuq.workers.dev/gruppenfinder/third-meeting-closeout)
          echo "$RESPONSE"
          RESPONSE_JSON="$RESPONSE" python -c "import json,os; x=json.loads(os.environ['RESPONSE_JSON']); assert x.get('ok') is True,x; assert x.get('state')=='THIRD_MEETING_GROUP_CLOSED_SUCCESSFULLY',x; assert x.get('participantCount')==3,x; assert x.get('emailsSent') in [0,3],x; assert x.get('duplicateSendPrevented') is True,x; print('Treffen-3-Abschluss kontrolliert geprueft ✅')"
