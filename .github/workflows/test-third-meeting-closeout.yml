name: Test Treffen 3 Abschluss

on:
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Treffen-3-Abschluss read-only pruefen
        env:
          PREVIEW_KEY: ${{ secrets.GRUPPENFINDER_PREVIEW_KEY }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${PREVIEW_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"meetingRecordId":"recoW2GmA9HQpCYxQ"}' \
            https://lavuq-bewerbung.lavuq.workers.dev/gruppenfinder/third-meeting-closeout)
          echo "$RESPONSE"
          RESPONSE_JSON="$RESPONSE" python -c "import json,os; x=json.loads(os.environ['RESPONSE_JSON']); assert x.get('ok') is True,x; assert x.get('state')=='THIRD_MEETING_CLOSEOUT_READY',x; assert x.get('dryRun') is True,x; assert x.get('emailsSent')==0,x; assert x.get('airtableChanged') is False,x; print('Treffen-3-Abschluss read-only erfolgreich geprueft ✅')"
