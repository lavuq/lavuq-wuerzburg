name: Test Treffen 3 Abschluss

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-third-meeting-closeout.yml'

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Kurz auf Worker-Deployment warten
        run: sleep 25
      - name: Treffen-3-Abschluss pruefen
        env:
          PREVIEW_KEY: ${{ secrets.GRUPPENFINDER_PREVIEW_KEY }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${PREVIEW_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"meetingRecordId":"recoW2GmA9HQpCYxQ"}' \
            https://lavuq-bewerbung.lavuq.workers.dev/gruppenfinder/third-meeting-closeout)
          echo "$RESPONSE"
          RESPONSE_JSON="$RESPONSE" python -c "import json,os; x=json.loads(os.environ['RESPONSE_JSON']); assert x.get('ok') is True,x; assert x.get('state')=='THIRD_MEETING_CLOSEOUT_READY',x; assert x.get('participantCount')==3,x; assert x.get('wouldCloseGroup') is True,x; assert x.get('wouldMarkMembersCompleted') is True,x; assert x.get('wouldSendEmails')==3,x; assert x.get('emailsSent')==0,x; assert x.get('airtableChanged') is False,x; print('Treffen-3-Abschluss Dry Run erfolgreich ✅')"
