name: Test Ersatz Einladungsfreigabe Dry-Run

on:
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Ersatz-Einladung nur prüfen
        env:
          KEY: ${{ secrets.GRUPPENFINDER_PREVIEW_KEY }}
        run: |
          set -euo pipefail
          MEMBER_ID="rec0HKqQ08APJCJ7g"
          URL="https://lavuq-bewerbung.lavuq.workers.dev/gruppenfinder/replacement-invitation-release"
          RES=$(curl -sS -w '\n%{http_code}' -X POST -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" --data "{\"memberId\":\"$MEMBER_ID\",\"dryRun\":true}" "$URL")
          BODY=$(echo "$RES" | sed '$d'); HTTP=$(echo "$RES" | tail -n1)
          echo "$BODY" | jq .
          echo "HTTP: $HTTP"
          test "$HTTP" = "200"
          test "$(echo "$BODY" | jq -r '.state')" = "READY_FOR_MANUAL_REPLACEMENT_INVITATION_RELEASE"
          test "$(echo "$BODY" | jq -r '.wouldReleaseOneInvitation')" = "true"
          test "$(echo "$BODY" | jq -r '.emailsSent')" = "false"
          test "$(echo "$BODY" | jq -r '.contactsReleased')" = "false"
          test "$(echo "$BODY" | jq -r '.airtableChanged')" = "false"
          echo "Ersatz-Einladung freigabefähig: JA"
          echo "E-Mail versendet: NEIN"
          echo "Kontakte freigegeben: NEIN"
          echo "Airtable geändert: NEIN"
          echo "Ersatz-Einladungsfreigabe Dry-Run erfolgreich ✅"
