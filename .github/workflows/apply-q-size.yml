name: Apply mobile Q size

on:
  push:
    paths:
      - 'header-q-size.css'
      - '.github/workflows/apply-q-size.yml'

permissions:
  contents: write

jobs:
  apply-q-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load final Q size override on public pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          excluded = {'mein-q.html','mitglied.html','refresh-lavuq.html'}
          version = '20260906-1356'
          changed = []

          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts or p.name in excluded:
                  continue
              text = p.read_text(encoding='utf-8')
              if 'class="site-header"' not in text and "class='site-header'" not in text:
                  continue
              prefix = '../' * (len(p.parts)-1)
              text2 = re.sub(r'<link rel="stylesheet" href="(?:\.\./)*header-q-size\.css\?v=[^"]+">', '', text)
              link = f'<link rel="stylesheet" href="{prefix}header-q-size.css?v={version}">'
              text2 = text2.replace('</head>', link + '</head>', 1)
              if text2 != text:
                  p.write_text(text2, encoding='utf-8')
                  changed.append(str(p))

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit Q size rollout
        run: |
          if git diff --quiet; then
            echo "No public pages needed updating."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy gold Q fully above header line"
          git push
