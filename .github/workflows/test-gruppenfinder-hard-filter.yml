name: Test Gruppenfinder Hard-Filter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hard-filter-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run read-only hard-filter regression
        run: node worker/gruppenfinder-hard-filter-regression.js
