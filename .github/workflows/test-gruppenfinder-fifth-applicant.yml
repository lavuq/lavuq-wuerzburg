name: Test Gruppenfinder 5. Bewerber Ranking

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fifth-applicant-ranking-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run read-only fifth applicant ranking regression
        run: node worker/gruppenfinder-fifth-applicant-regression.js
