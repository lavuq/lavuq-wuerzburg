name: Test Treffen 2 24h Erinnerung Dry-Run

on:
  workflow_dispatch:

jobs:
  second-meeting-reminder-24h-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: 24h Erinnerung fuer Treffen 2 nur pruefen
        env:
          PREVIEW_KEY: ${{ secrets.GRUPPENFINDER_PREVIEW_KEY }}
        run: |
          set -euo pipefail
          URL="https://lavuq-bewerbung.lavuq.workers.dev/gruppenfinder/second-meeting-reminder-24h"
          MEETING_ID="rec3iPEAAW6prt6A2"
          AS_OF="2026-09-14T16:00:00.000Z"
          RESP=$(curl -sS -w '\n%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer $PREVIEW_KEY" \
            -H "Content-Type: application/json" \
            --data '{"meetingRecordId":"'"$MEETING_ID"'","asOf":"'"$AS_OF"'"}')
          JSON=$(echo "$RESP" | sed '$d')
          HTTP=$(echo "$RESP" | tail -n1)
          echo "$JSON" | jq .
          test "$HTTP" = "200"
          echo "$JSON" | jq -e '.ok == true and .state == "READY_FOR_SECOND_MEETING_24H_REMINDER" and .dryRun == true and .readOnly == true and .meetingAttempt == 2 and .hoursUntilMeeting == 24 and .reminderWindowMatched == true and .reminderAlreadyCompleted == false and .recipientFilterCount == 3 and .validRecipientCount == 3 and .excludedCurrentAcceptedCount == 1 and .alreadySentCount == 0 and .pendingRecipientCount == 3 and .ambiguousRecipientCount == 0 and .wouldSendEmails == 3 and .excludedMembersWouldReceiveReminder == false and .emailsSent == 0 and .airtableChanged == false and .duplicateSendPrevented == true and .piiExposedInResponse == false and .recipientIdsExposedInResponse == false' >/dev/null
          echo "Treffen-2-24h-Erinnerung bereit: JA"
          echo "Simulierter Abstand: 24 Stunden"
          echo "Berechtigte Empfaenger: 3"
          echo "Ausgeschlossene Person erhaelt keine Erinnerung: JA"
          echo "E-Mails tatsaechlich versendet: NEIN"
          echo "Airtable geaendert: NEIN"
          echo "Treffen-2-24h-Dry-Run erfolgreich ✅"
