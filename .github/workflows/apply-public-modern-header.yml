name: Apply public modern header

on:
  push:
    paths:
      - 'header-modern.css'

permissions:
  contents: write

jobs:
  apply-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply modern header stylesheet to public website pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          excluded = {'mein-q.html','mitglied.html','refresh-lavuq.html'}
          version = '20260905-4'
          changed = []
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts or p.name in excluded:
                  continue
              text = p.read_text(encoding='utf-8')
              if 'class="site-header"' not in text and "class='site-header'" not in text:
                  continue
              text2 = re.sub(r'<link rel="stylesheet" href="(?:\.\./)*header-modern\.css\?v=[^"]+">', '', text)
              prefix = '../' * (len(p.parts)-1)
              page_link = f'<link rel="stylesheet" href="{prefix}header-modern.css?v={version}">'
              text2 = text2.replace('</head>', page_link + '</head>', 1)
              if text2 != text:
                  p.write_text(text2, encoding='utf-8')
                  changed.append(str(p))
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit header rollout
        run: |
          if git diff --quiet; then
            echo "No public pages needed updating."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply exact modern header to public website pages"
          git push
