name: Apply public modern header

on:
  push:
    paths:
      - 'header-modern.css'
      - 'header-q-single.css'
      - 'lavuq-q-single-header.svg'
      - '.github/workflows/apply-public-modern-header.yml'

permissions:
  contents: write

jobs:
  apply-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Standardize public header markup and stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          excluded = {'mein-q.html','mitglied.html','refresh-lavuq.html'}
          version = '20260906-0235'
          changed = []

          guard = '''<script id="lavuq-public-header-image-guard">(function(){const h=document.querySelector('header.site-header');if(!h)return;const clean=()=>h.querySelectorAll('img,object,embed').forEach(el=>el.remove());clean();new MutationObserver(clean).observe(h,{childList:true,subtree:true});})();</script>'''

          q_mask = '''<style id="lavuq-q-legacy-mask">
@media(max-width:520px){
  html body header.site-header .nav-wrap a.public-brand > .public-brand-q-crop{
    width:112px!important;
    height:108px!important;
    min-width:112px!important;
    min-height:108px!important;
    max-width:112px!important;
    max-height:108px!important;
    background-color:#041529!important;
    background-size:68px 68px!important;
    background-position:center center!important;
    background-repeat:no-repeat!important;
    overflow:hidden!important;
    z-index:80!important;
  }
}
@media(max-width:390px){
  html body header.site-header .nav-wrap a.public-brand > .public-brand-q-crop{
    width:104px!important;
    height:102px!important;
    min-width:104px!important;
    min-height:102px!important;
    max-width:104px!important;
    max-height:102px!important;
    background-size:62px 62px!important;
  }
}
</style>'''

          legacy_header_rules = [
              r'\s*\.site-header \.brand>span:not\(\.mobile-brand-copy\):not\(\.public-brand-q-crop\):not\(\.public-brand-line\)\{[^}]*\}',
              r'\s*\.site-header \.brand>span:not\(\.mobile-brand-copy\):not\(\.public-brand-q-crop\):not\(\.public-brand-line\):before\{[^}]*\}',
              r'\s*\.site-header \.brand>span:not\(\.mobile-brand-copy\):not\(\.public-brand-q-crop\):not\(\.public-brand-line\):after\{[^}]*\}',
              r'\s*body \.site-header \.nav-wrap \.brand-mark:not\(\.public-brand-q\),\s*body \.site-header \.nav-wrap \.mobile-brand-q\{[^}]*\}',
              r'\s*body \.site-header \.nav-wrap a\.public-brand>\.public-brand-q-crop\{[^}]*\}',
          ]

          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts or p.name in excluded:
                  continue
              text = p.read_text(encoding='utf-8')
              if 'class="site-header"' not in text and "class='site-header'" not in text:
                  continue

              prefix = '../' * (len(p.parts)-1)
              home = prefix + 'index.html'

              pattern = re.compile(r'(<header class="site-header"><div class="container nav-wrap">).*?(<nav class="nav">)', re.S)
              replacement = (
                  r'\1'
                  f'<a class="brand public-brand" href="{home}">'
                  '<span class="public-brand-copy"><span class="public-brand-name">LAVU</span><span class="public-brand-city">Würzburg</span></span>'
                  '<span class="public-brand-line public-brand-line-left" aria-hidden="true"></span>'
                  '<span class="public-brand-q-crop" aria-hidden="true"></span>'
                  '<span class="public-brand-line public-brand-line-right" aria-hidden="true"></span>'
                  '</a>'
                  '<button class="nav-toggle public-menu-toggle" aria-label="Menü öffnen" aria-expanded="false"><span class="public-menu-icon" aria-hidden="true">☰</span><span class="public-menu-label">Menü</span></button>'
                  r'\2'
              )
              text2, n = pattern.subn(replacement, text, count=1)
              if n == 0:
                  continue

              for legacy_rule in legacy_header_rules:
                  text2 = re.sub(legacy_rule, '', text2)

              text2 = re.sub(r'<script id="lavuq-public-header-image-guard">.*?</script>', '', text2, flags=re.S)
              text2 = text2.replace('</header>', '</header>' + guard, 1)

              text2 = re.sub(r'<style id="lavuq-q-legacy-mask">.*?</style>', '', text2, flags=re.S)
              text2 = re.sub(r'<link rel="stylesheet" href="(?:\.\./)*header-modern\.css\?v=[^"]+">', '', text2)
              text2 = re.sub(r'<link rel="stylesheet" href="(?:\.\./)*header-q-single\.css\?v=[^"]+">', '', text2)
              modern = f'<link rel="stylesheet" href="{prefix}header-modern.css?v={version}">'
              single_q = f'<link rel="stylesheet" href="{prefix}header-q-single.css?v={version}">'
              text2 = text2.replace('</head>', modern + single_q + q_mask + '</head>', 1)

              if text2 != text:
                  p.write_text(text2, encoding='utf-8')
                  changed.append(str(p))

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit header rollout
        run: |
          if git diff --quiet; then
            echo "No public pages needed updating."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy masked public mobile header"
          git push
