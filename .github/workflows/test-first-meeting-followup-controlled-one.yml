name: Test Treffen 1 Nachbereitung Controlled One

on:
  workflow_dispatch:

jobs:
  first-meeting-followup-controlled-one:
    runs-on: ubuntu-latest
    steps:
      - name: Genau eine Nachbereitungs-Testmail senden
        env:
          PREVIEW_KEY: ${{ secrets.GRUPPENFINDER_PREVIEW_KEY }}
        run: |
          set -euo pipefail
          URL="https://lavuq-bewerbung.lavuq.workers.dev/gruppenfinder/first-meeting-followup"
          GROUP_ID="rec1qr2gZqRVxaCGk"
          BODY='{"groupId":"'"$GROUP_ID"'","asOf":"2026-09-10T20:00:00+02:00","controlledOne":true,"confirmation":"EINE_NACHBEREITUNG_SENDEN"}'
          RESP=$(curl -sS -w '\n%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer $PREVIEW_KEY" \
            -H "Content-Type: application/json" \
            --data "$BODY")
          JSON=$(echo "$RESP" | sed '$d')
          HTTP=$(echo "$RESP" | tail -n1)
          echo "$JSON" | jq .
          test "$HTTP" = "200"
          echo "$JSON" | jq -e '.ok == true and .state == "ONE_FIRST_MEETING_FOLLOWUP_TEST_SENT" and .dryRun == false and .controlledOne == true and .meetingAttempt == 1 and .eligibleRecipientCount == 4 and .emailsSent == 1 and .otherEmailsSent == 0 and .feedbackRequestsCreated == 0 and .secondMeetingPrepared == false and .followupMarkedComplete == false and .airtableChanged == false and .providerAccepted == true and (.providerStatus >= 200 and .providerStatus < 300) and .providerMessageIdPresent == true and .piiExposedInResponse == false' >/dev/null
          echo "HTTP: $HTTP"
          echo "Genau eine Nachbereitungs-Testmail versendet: JA"
          echo "Brevo hat die Nachricht angenommen: JA"
          echo "Brevo Message-ID vorhanden: JA"
          echo "Weitere Nachbereitungs-Mails versendet: NEIN"
          echo "Feedback-Datensaetze angelegt: NEIN"
          echo "Treffen 2 vorbereitet: NEIN"
          echo "Nachbereitung global als erledigt markiert: NEIN"
          echo "Airtable geaendert: NEIN"
          echo "Personenbezogene Kontaktdaten im Log: NEIN"
          echo "Controlled-One Treffen-1-Nachbereitung erfolgreich ✅"
