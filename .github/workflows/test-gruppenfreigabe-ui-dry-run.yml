name: Test Gruppenfreigabe UI Dry-Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Zweistufigen Freigabe-Ablauf read-only prüfen
        env:
          PREVIEW_KEY: ${{ secrets.GRUPPENFINDER_PREVIEW_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PREVIEW_KEY:-}" || { echo "Secret fehlt"; exit 1; }

          page="$(mktemp)"
          code="$(curl -sS -o "$page" -w "%{http_code}" \
            -H "Authorization: Bearer ${PREVIEW_KEY}" \
            "https://lavuq-bewerbung.lavuq.workers.dev/gruppenfinder/proposal-review?testMode=controlled-multi")"
          echo "Prüfansicht HTTP: $code"
          test "$code" = "200"
          grep -q "Gruppe freigeben" "$page"
          grep -q "Diese 4er-Gruppe wirklich freigeben?" "$page"
          grep -q "Ja, Gruppe jetzt freigeben" "$page"
          grep -q "dryRun:true" "$page"
          echo "Erster Freigabe-Button vorhanden: JA"
          echo "Zweite Bestätigung vorhanden: JA"
          echo "UI verwendet weiterhin Dry-Run: JA"

          result="$(mktemp)"
          release_code="$(curl -sS -o "$result" -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${PREVIEW_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"dryRun":true,"confirm":"GRUPPE_FREIGEBEN","testMode":"controlled-multi"}' \
            "https://lavuq-bewerbung.lavuq.workers.dev/gruppenfinder/proposal-release")"
          echo "Freigabe-Dry-Run HTTP: $release_code"
          test "$release_code" = "200"
          grep -q 'READY_FOR_MANUAL_GROUP_RELEASE' "$result"
          grep -q '"dryRun": true' "$result"
          echo "Zweistufiger Freigabe-Ablauf technisch bereit: JA"
          echo "Airtable geändert: NEIN"
          echo "Gruppe angelegt: NEIN"
          echo "Einladungen versendet: NEIN"
          echo "Kontakte freigegeben: NEIN"
          echo "UI-Gruppenfreigabe Dry-Run erfolgreich ✅"
          rm -f "$page" "$result"
