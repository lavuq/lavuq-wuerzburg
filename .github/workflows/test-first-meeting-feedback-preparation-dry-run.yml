name: Test Treffen 1 Feedback-Vorbereitung Dry-Run

on:
  workflow_dispatch:

jobs:
  first-meeting-feedback-preparation-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Feedback-Vorbereitung Treffen 1 nur pruefen
        env:
          PREVIEW_KEY: ${{ secrets.GRUPPENFINDER_PREVIEW_KEY }}
        run: |
          set -euo pipefail
          URL="https://lavuq-bewerbung.lavuq.workers.dev/gruppenfinder/first-meeting-followup"
          GROUP_ID="rec1qr2gZqRVxaCGk"
          BODY='{"groupId":"'"$GROUP_ID"'","asOf":"2026-09-10T20:00:00+02:00","feedbackPreparationDryRun":true}'
          RESP=$(curl -sS -w '\n%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer $PREVIEW_KEY" \
            -H "Content-Type: application/json" \
            --data "$BODY")
          JSON=$(echo "$RESP" | sed '$d')
          HTTP=$(echo "$RESP" | tail -n1)
          echo "$JSON" | jq .
          test "$HTTP" = "200"
          echo "$JSON" | jq -e '.ok == true and .state == "READY_TO_PREPARE_FIRST_MEETING_FEEDBACK" and .dryRun == true and .readOnly == true and .feedbackPreparationDryRun == true and .meetingAttempt == 1 and .meetingPassed == true and .followupCompleted == true and .eligibleRecipientCount == 4 and .exactlyFourEligibleRecipients == true and .wouldSendEmails == 0 and .wouldPrepareSecondMeeting == false and .airtableChanged == false and .piiExposedInResponse == false' >/dev/null
          echo "HTTP: $HTTP"
          echo "Treffen 1 vorbei: JA"
          echo "Nachbereitung fuer alle abgeschlossen: JA"
          echo "Vier berechtigte Teilnehmer: JA"
          echo "Vorhandene Feedback-Anfragen: $(echo "$JSON" | jq -r '.existingFeedbackRequestCount')"
          echo "Fehlende Feedback-Anfragen: $(echo "$JSON" | jq -r '.missingFeedbackRequestCount')"
          echo "Wuerde Feedback-Datensaetze erzeugen: $(echo "$JSON" | jq -r '.wouldCreateFeedbackRequests')"
          echo "Wuerde persoenliche Feedback-Links erzeugen: $(echo "$JSON" | jq -r '.wouldCreatePersonalFeedbackLinks')"
          echo "E-Mails versendet: NEIN"
          echo "Treffen 2 vorbereitet: NEIN"
          echo "Airtable geaendert: NEIN"
          echo "Feedback-Vorbereitung-Dry-Run erfolgreich ✅"
