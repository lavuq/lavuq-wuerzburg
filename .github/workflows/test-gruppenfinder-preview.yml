name: Test Gruppenfinder Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call protected read-only preview
        id: call
        env:
          PREVIEW_KEY: ${{ secrets.GRUPPENFINDER_PREVIEW_KEY }}
          MEMBER_ID: ${{ secrets.GRUPPENFINDER_TEST_MEMBER_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${PREVIEW_KEY:-}" ]; then
            echo "Fehler: GitHub Secret GRUPPENFINDER_PREVIEW_KEY fehlt."
            exit 1
          fi

          if [ -z "${MEMBER_ID:-}" ]; then
            echo "Fehler: GitHub Secret GRUPPENFINDER_TEST_MEMBER_ID fehlt."
            exit 1
          fi

          tmp_body="$(mktemp)"
          http_code="$(curl -sS \
            -o "$tmp_body" \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${PREVIEW_KEY}" \
            --get \
            --data-urlencode "member=${MEMBER_ID}" \
            "https://lavuq-bewerbung.lavuq.workers.dev/gruppenfinder/replacement-preview")"

          echo "HTTP-Status: ${http_code}"

          RESPONSE_FILE="$tmp_body" HTTP_CODE="$http_code" python3 - <<'PY'
          import json
          import os
          import sys

          path = os.environ["RESPONSE_FILE"]
          http_code = os.environ["HTTP_CODE"]

          try:
              with open(path, "r", encoding="utf-8") as fh:
                  data = json.load(fh)
          except Exception:
              print("Preview-Test fehlgeschlagen: ungültige JSON-Antwort.")
              sys.exit(1)

          if http_code != "200" or data.get("ok") is not True:
              safe_codes = {
                  "MEMBER_LINK_MISSING",
                  "REMAINING_MEMBER_COUNT",
                  "MISSING_PAIR_SCORES",
              }
              code = data.get("code")
              if code in safe_codes:
                  print(f"Diagnosecode: {code}")
              else:
                  print("Diagnosecode: UNKNOWN_PREVIEW_ERROR")
              sys.exit(1)

          best = data.get("best") or {}
          print("Gruppenfinder Preview erfolgreich ✅")
          print(f"Modus: {data.get('mode', 'unbekannt')}")
          print(f"Bewertete Kandidaten: {data.get('evaluatedCandidates', 0)}")
          print(f"Geeignete Kandidaten: {data.get('suitableCandidates', 0)}")
          print(f"Bester Gruppen-Durchschnitt: {best.get('groupAverage', '—')}")
          print(f"Schwächster Paar-Score: {best.get('weakestPair', '—')}")
          print(f"Empfehlung: {best.get('recommendation', '—')}")
          PY

          rm -f "$tmp_body"
