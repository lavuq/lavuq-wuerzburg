name: Test 24h Treffen-Erinnerung Controlled One

on:
  workflow_dispatch:

jobs:
  meeting-reminder-24h-controlled-one:
    runs-on: ubuntu-latest
    steps:
      - name: Genau eine 24h-Test-Erinnerung senden
        env:
          PREVIEW_KEY: ${{ secrets.GRUPPENFINDER_PREVIEW_KEY }}
        run: |
          set -euo pipefail
          URL="https://lavuq-bewerbung.lavuq.workers.dev/gruppenfinder/meeting-reminder-24h"
          GROUP_ID="rec1qr2gZqRVxaCGk"
          BODY='{"groupId":"'"$GROUP_ID"'","asOf":"2026-09-09T18:00:00+02:00","controlledOne":true,"confirmation":"EINE_24H_ERINNERUNG_SENDEN"}'
          RESP=$(curl -sS -w '\n%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer $PREVIEW_KEY" \
            -H "Content-Type: application/json" \
            --data "$BODY")
          JSON=$(echo "$RESP" | sed '$d')
          HTTP=$(echo "$RESP" | tail -n1)
          echo "$JSON" | jq .
          test "$HTTP" = "200"
          echo "$JSON" | jq -e '.ok == true and .state == "ONE_24H_TEST_REMINDER_SENT" and .controlledOne == true and .emailsSent == 1 and .otherEmailsSent == 0 and .meetingReminderMarkedComplete == false and .airtableChanged == false and .piiExposedInResponse == false' >/dev/null
          echo "HTTP: $HTTP"
          echo "Genau eine 24h-Test-Erinnerung versendet: JA"
          echo "Weitere Erinnerungen versendet: NEIN"
          echo "24h-Erinnerung global als erledigt markiert: NEIN"
          echo "Airtable geaendert: NEIN"
          echo "Personenbezogene Kontaktdaten im Log: NEIN"
          echo "Controlled-One 24h-Erinnerung erfolgreich ✅"
