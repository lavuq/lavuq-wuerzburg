name: Test Treffen 1 Feedback-Mail Controlled All

on:
  workflow_dispatch:

jobs:
  first-meeting-feedback-mail-controlled-all:
    runs-on: ubuntu-latest
    steps:
      - name: Restliche persoenliche Feedback-Testmails kontrolliert senden
        env:
          PREVIEW_KEY: ${{ secrets.GRUPPENFINDER_PREVIEW_KEY }}
        run: |
          set -euo pipefail
          URL="https://lavuq-bewerbung.lavuq.workers.dev/gruppenfinder/first-meeting-feedback-mail"
          GROUP_ID="rec1qr2gZqRVxaCGk"
          BODY='{"groupId":"'"$GROUP_ID"'","controlledAll":true,"confirmation":"RESTLICHE_FEEDBACK_MAILS_SENDEN"}'
          RESP=$(curl -sS -w '\n%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer $PREVIEW_KEY" \
            -H "Content-Type: application/json" \
            --data "$BODY")
          JSON=$(echo "$RESP" | sed '$d')
          HTTP=$(echo "$RESP" | tail -n1)
          echo "$JSON" | jq .
          test "$HTTP" = "200"

          echo "$JSON" | jq -e '
            .ok == true and
            .controlledAll == true and
            .feedbackRequestCount == 4 and
            .totalMarkedSent == 4 and
            .remainingUnsentCount == 0 and
            .duplicateSendPrevented == true and
            .allProviderAccepted == true and
            .secondMeetingPrepared == false and
            .piiExposedInResponse == false and
            .tokenExposedInResponse == false and
            .linkExposedInResponse == false and
            (
              (
                .state == "REMAINING_FIRST_MEETING_FEEDBACK_MAILS_SENT" and
                .emailsSent == 3 and
                .alreadySentCount == 1 and
                .providerMessageIdCount == 3 and
                .airtableChanged == true
              )
              or
              (
                .state == "ALL_FIRST_MEETING_FEEDBACK_MAILS_ALREADY_SENT" and
                .emailsSent == 0 and
                .alreadySentCount == 4 and
                .providerMessageIdCount == 4 and
                .airtableChanged == false
              )
            )
          ' >/dev/null

          STATE=$(echo "$JSON" | jq -r '.state')
          if [ "$STATE" = "ALL_FIRST_MEETING_FEEDBACK_MAILS_ALREADY_SENT" ]; then
            echo "Keine neue Feedback-Mail versendet: JA"
            echo "Bereits versendet: 4"
            echo "Doppelversand erfolgreich verhindert: JA"
          else
            echo "Neue Feedback-Mails versendet: 3"
            echo "Bereits vorher versendet: 1"
          fi
          echo "Insgesamt als versendet markiert: 4"
          echo "Treffen 2 vorbereitet: NEIN"
          echo "Personenbezogene Daten, Token oder Link im Log: NEIN"
          echo "Controlled-All Feedback-Mail erfolgreich ✅"
