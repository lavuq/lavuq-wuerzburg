name: Test Treffen 3 Feedback-Auswertung Dry Run

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-third-meeting-feedback-decision.yml'

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Kurz auf Worker-Deployment warten
        run: sleep 25

      - name: Treffen-3-Feedback-Auswertung pruefen
        env:
          PREVIEW_KEY: ${{ secrets.GRUPPENFINDER_PREVIEW_KEY }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${PREVIEW_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"meetingRecordId":"recoW2GmA9HQpCYxQ"}' \
            https://lavuq-bewerbung.lavuq.workers.dev/gruppenfinder/third-meeting-feedback-decision)
          echo "$RESPONSE"
          RESPONSE_JSON="$RESPONSE" python -c "import json,os; x=json.loads(os.environ['RESPONSE_JSON']); assert x.get('ok') is True, x; assert x.get('state')=='THIRD_MEETING_FEEDBACK_DECISION_DRY_RUN', x; assert x.get('feedbackRequestCount')==3, x; assert x.get('submittedCount')==1, x; assert x.get('pendingFeedbackCount')==2, x; assert x.get('decision')=='WAIT_FOR_ALL_FEEDBACKS', x; assert x.get('emailsSent')==0, x; assert x.get('airtableChanged') is False, x; assert x.get('piiExposedInResponse') is False, x; print('Treffen-3-Feedback-Auswertung wartet korrekt auf die zwei offenen Feedbacks ✅')"
