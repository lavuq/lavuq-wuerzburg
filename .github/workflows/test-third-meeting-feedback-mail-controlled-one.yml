name: Test Treffen 3 Feedback kontrolliert eine Mail

on:
  workflow_dispatch:

jobs:
  controlled-one:
    runs-on: ubuntu-latest
    steps:
      - name: Genau eine Treffen-3-Feedback-Testmail senden
        env:
          PREVIEW_KEY: ${{ secrets.GRUPPENFINDER_PREVIEW_KEY }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${PREVIEW_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"meetingRecordId":"recoW2GmA9HQpCYxQ","controlledOne":true,"confirmation":"EINE_TREFFEN_3_FEEDBACK_MAIL_SENDEN"}' \
            https://lavuq-bewerbung.lavuq.workers.dev/gruppenfinder/third-meeting-feedback-mail)

          echo "$RESPONSE"

          RESPONSE_JSON="$RESPONSE" python - <<'PY'
          import json, os
          data=json.loads(os.environ["RESPONSE_JSON"])
          assert data.get("ok") is True, data
          assert data.get("state") in ["ONE_THIRD_MEETING_FEEDBACK_MAIL_SENT","THIRD_MEETING_FEEDBACK_MAIL_TEST_ALREADY_COMPLETED"], data
          assert data.get("feedbackRequestCount") == 3, data
          assert data.get("emailsSent") in [0,1], data
          assert data.get("duplicateSendPrevented") is True, data
          assert data.get("piiExposedInResponse") is False, data
          assert data.get("tokenExposedInResponse") is False, data
          assert data.get("linkExposedInResponse") is False, data
          print("Treffen-3-Feedback-Testmail kontrolliert verarbeitet ✅")
          PY
