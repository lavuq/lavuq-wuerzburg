name: Test Treffen 2 Feedbackmail Controlled One

on:
  workflow_dispatch:

jobs:
  send-one-second-meeting-feedback-mail:
    runs-on: ubuntu-latest
    steps:
      - name: Genau eine Feedback-Testmail an Simon senden
        env:
          PREVIEW_KEY: ${{ secrets.GRUPPENFINDER_PREVIEW_KEY }}
        run: |
          set -euo pipefail
          URL="https://lavuq-bewerbung.lavuq.workers.dev/gruppenfinder/second-meeting-feedback-mail"
          BODY='{"meetingRecordId":"rec3iPEAAW6prt6A2","targetApplicantId":"recDJTxYsYc3KCoX6","controlledOne":true,"confirmation":"EINE_TREFFEN_2_FEEDBACK_MAIL_SENDEN"}'
          RESP=$(curl -sS -w '\n%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer $PREVIEW_KEY" \
            -H "Content-Type: application/json" \
            --data "$BODY")
          JSON=$(echo "$RESP" | sed '$d')
          HTTP=$(echo "$RESP" | tail -n1)
          echo "$JSON" | jq .
          test "$HTTP" = "200"
          echo "$JSON" | jq -e '.ok == true and .state == "ONE_SECOND_MEETING_FEEDBACK_MAIL_SENT" and .controlledOne == true and .feedbackRequestCount == 3 and .emailsSent == 1 and .otherEmailsSent == 0 and .remainingUnsentCount == 2 and .providerAccepted == true and .providerMessageIdPresent == true and .feedbackMailMarkedSent == true and .duplicateSendPrevented == true and .airtableChanged == true and .thirdMeetingPrepared == false and .piiExposedInResponse == false and .recipientIdsExposedInResponse == false and .tokenExposedInResponse == false and .linkExposedInResponse == false' >/dev/null
          echo "Feedback-Testmails versendet: 1"
          echo "Weitere Empfaenger angeschrieben: NEIN"
          echo "Noch nicht versendet: 2"
          echo "Doppelversandschutz: AKTIV"
          echo "Controlled-One Versand erfolgreich ✅"
