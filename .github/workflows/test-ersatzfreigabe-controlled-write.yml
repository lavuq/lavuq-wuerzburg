name: Test Ersatzfreigabe Controlled Write

on:
  workflow_dispatch:

jobs:
  controlled-replacement-write:
    runs-on: ubuntu-latest
    steps:
      - name: Ersatz zuerst prüfen und dann bewusst freigeben
        env:
          KEY: ${{ secrets.GRUPPENFINDER_PREVIEW_KEY }}
        run: |
          set -euo pipefail
          DECLINED_MEMBER_ID="recoaWZXj5Bm10v48"
          URL="https://lavuq-bewerbung.lavuq.workers.dev/gruppenfinder/replacement-release"

          DRY=$(curl -sS -w '\n%{http_code}' -X POST -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" --data "{\"declinedMemberId\":\"$DECLINED_MEMBER_ID\",\"dryRun\":true}" "$URL")
          DRY_BODY=$(echo "$DRY" | sed '$d'); DRY_HTTP=$(echo "$DRY" | tail -n1)
          echo "$DRY_BODY" | jq .
          test "$DRY_HTTP" = "200"
          test "$(echo "$DRY_BODY" | jq -r '.state')" = "READY_FOR_MANUAL_REPLACEMENT_RELEASE"
          test "$(echo "$DRY_BODY" | jq -r '.airtableChanged')" = "false"
          test "$(echo "$DRY_BODY" | jq -r '.safety.invitationSent')" = "false"
          test "$(echo "$DRY_BODY" | jq -r '.safety.contactsReleased')" = "false"
          echo "Dry-Run erfolgreich – noch keine Änderung."

          WRITE=$(curl -sS -w '\n%{http_code}' -X POST -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" --data "{\"declinedMemberId\":\"$DECLINED_MEMBER_ID\",\"dryRun\":false,\"confirmation\":\"ERSATZ_FREIGEBEN\"}" "$URL")
          BODY=$(echo "$WRITE" | sed '$d'); HTTP=$(echo "$WRITE" | tail -n1)
          echo "$BODY" | jq .
          echo "HTTP: $HTTP"
          test "$HTTP" = "200"
          STATE=$(echo "$BODY" | jq -r '.state')
          test "$STATE" = "REPLACEMENT_MANUALLY_RELEASED" -o "$STATE" = "REPLACEMENT_ALREADY_RELEASED"
          test "$(echo "$BODY" | jq -r '.safety.invitationSent')" = "false"
          test "$(echo "$BODY" | jq -r '.safety.contactsReleased')" = "false"
          test "$(echo "$BODY" | jq -r '.safety.inviteReleaseSet')" = "false"
          echo "Ersatz kontrolliert eingesetzt: JA"
          echo "Einladung versendet: NEIN"
          echo "Einladungsfreigabe gesetzt: NEIN"
          echo "Kontakte freigegeben: NEIN"
          echo "Kontrollierte Ersatzfreigabe erfolgreich ✅"
