name: Test Gruppenfinder 7. Bewerber Ranking

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seventh-applicant-ranking-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run read-only seventh applicant ranking regression
        run: node worker/gruppenfinder-seventh-applicant-regression.js
