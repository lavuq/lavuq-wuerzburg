name: Test Treffen 3 2h-Erinnerung Dry Run

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-third-meeting-reminder-2h-dry-run.yml'

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Kurz auf Worker-Deployment warten
        run: sleep 20

      - name: Treffen-3-2h-Erinnerung nur prüfen
        env:
          PREVIEW_KEY: ${{ secrets.GRUPPENFINDER_PREVIEW_KEY }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${PREVIEW_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"meetingRecordId":"recoW2GmA9HQpCYxQ","mode":"dryRun","asOf":"2026-09-22T15:30:00.000Z","simulate24hCompleted":true}' \
            https://lavuq-bewerbung.lavuq.workers.dev/gruppenfinder/third-meeting-reminder-2h)

          echo "$RESPONSE"

          RESPONSE_JSON="$RESPONSE" python - <<'PY'
          import json, os
          data=json.loads(os.environ["RESPONSE_JSON"])
          assert data.get("ok") is True, data
          assert data.get("state") == "READY_FOR_THIRD_MEETING_2H_REMINDER", data
          assert data.get("meetingAttempt") == 3, data
          assert data.get("hoursUntilMeeting") == 2, data
          assert data.get("reminderWindowMatched") is True, data
          assert data.get("reminder24hSimulated") is True, data
          assert data.get("reminder24hEffectiveCompleted") is True, data
          assert data.get("validRecipientCount") == 3, data
          assert data.get("wouldSendEmails") == 3, data
          assert data.get("emailsSent") == 0, data
          assert data.get("airtableChanged") is False, data
          assert data.get("duplicateSendPrevented") is True, data
          print("Treffen-3-2h-Erinnerung ist korrekt bereit ✅")
          PY
