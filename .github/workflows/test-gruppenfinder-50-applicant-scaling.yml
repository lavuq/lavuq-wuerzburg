name: Test Gruppenfinder 50 Bewerber Skalierung

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaling-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run read-only 50 applicant scaling regression
        run: node worker/gruppenfinder-50-applicant-scaling-regression.js
