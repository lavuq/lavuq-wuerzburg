<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAVUQ aktualisieren</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f3ea;color:#132033;font-family:Inter,system-ui,sans-serif}.box{width:min(calc(100% - 32px),520px);background:#fff;border:1px solid #e7e0d2;border-radius:20px;padding:28px;text-align:center;box-shadow:0 14px 36px rgba(4,21,41,.08)}h1{margin:0 0 10px}.muted{color:#667085;line-height:1.5}</style></head><body><div class="box"><h1>LAVUQ wird aktualisiert …</h1><p class="muted">Cache und PWA-Daten werden neu geladen. Du wirst gleich automatisch zu Mein Q weitergeleitet.</p></div><script>(async()=>{try{if('caches' in window){for(const k of await caches.keys())await caches.delete(k)}if('serviceWorker' in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}}catch(e){}const target='/mitglied.html?demo=1&demoUser=daniel&demoStage=round2&v='+Date.now()+'#treffen';setTimeout(()=>location.replace(target),700)})();</script></body></html>
