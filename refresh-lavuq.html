<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAVUQ aktualisieren</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#041529;color:#fff;font-family:Inter,system-ui,sans-serif}.box{width:min(calc(100% - 32px),520px);background:#0b213c;border:1px solid rgba(216,180,106,.45);border-radius:20px;padding:28px;text-align:center;box-shadow:0 14px 36px rgba(0,0,0,.22)}h1{margin:0 0 10px}.muted{color:#c9d2dc;line-height:1.5}</style></head><body><div class="box"><h1>LAVUQ wird aktualisiert …</h1><p class="muted">Safari- und PWA-Cache werden geleert. Danach öffnet sich automatisch die Startseite mit dem neuen Header.</p></div><script>(async()=>{try{if('caches' in window){for(const k of await caches.keys())await caches.delete(k)}if('serviceWorker' in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}}catch(e){}const target='/?headerfix=20260906-0019-'+Date.now();setTimeout(()=>location.replace(target),900)})();</script></body></html>
