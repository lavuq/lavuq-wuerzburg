<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Weiterleitung zu Mein LAVUQ</title>
<style>
:root{--navy:#041529;--gold:#d8b46a;--cream:#f7f3ea;--ink:#132033}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.card{width:min(calc(100% - 32px),560px);background:#fff;border:1px solid rgba(216,180,106,.45);border-radius:22px;padding:30px;text-align:center;box-shadow:0 18px 50px rgba(4,21,41,.08)}
.logo{background:var(--navy);border-radius:16px;padding:20px;margin-bottom:24px;color:#fff;font-family:Georgia,"Times New Roman",serif;font-size:28px;letter-spacing:.12em}.logo span{display:block;color:var(--gold);font-size:15px;letter-spacing:0;margin-top:7px}
a{display:inline-block;margin-top:16px;background:var(--gold);color:var(--navy);text-decoration:none;font-weight:800;padding:13px 18px;border-radius:12px}
</style>
</head>
<body>
<main class="card">
<div class="logo">LAVUQ<span>Würzburg</span></div>
<h1>Terminplanung ist jetzt in „Mein LAVUQ“</h1>
<p>Du wirst automatisch in deinen persönlichen Mitgliederbereich zum Bereich „Treffen“ weitergeleitet.</p>
<a id="continueLink" href="mitglied.html#treffen">Mein LAVUQ öffnen</a>
</main>
<script>
(()=>{
 const q=new URLSearchParams(location.search);
 const member=q.get('member')||'';
 const token=q.get('token')||'';
 const target=new URL('mitglied.html',location.href);
 if(member)target.searchParams.set('member',member);
 if(token)target.searchParams.set('token',token);
 target.hash='treffen';
 document.getElementById('continueLink').href=target.toString();
 if(member&&token)location.replace(target.toString());
})();
</script>
</body>
</html>
